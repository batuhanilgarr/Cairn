name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: UI layout checks (real Chrome, many sizes and themes)
        run: npm run test:ui
      - name: CLI
        working-directory: cli
        run: npm ci && npm run typecheck && npm test
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: mkdir -p dist   # tauri's build script expects the frontend folder to exist
      - run: cargo test --lib
        working-directory: src-tauri
