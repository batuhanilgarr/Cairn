name: Release
on:
  push:
    tags: ["v*"]
jobs:
  macos:
    runs-on: macos-14
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build universal DMG and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is off until you have an Apple Developer account: tauri-action treats these variables as
          # "sign the app" even when the secrets are empty, which fails the build. To enable signing and
          # notarization, add the repository secrets and uncomment:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Reqnest ${{ github.ref_name }}"
          releaseBody: "Download **Reqnest-universal.dmg**, open it and drag Reqnest to Applications. This build is not signed with an Apple Developer ID, so macOS blocks the first launch: run `xattr -dr com.apple.quarantine /Applications/Reqnest.app` once, or open System Settings > Privacy & Security and choose **Open Anyway**."
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
      # The website links to releases/latest/download/Reqnest-universal.dmg, a name that does not change with the version.
      - name: Attach a stable-named DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find src-tauri/target -name '*.dmg' -path '*bundle/dmg*' | head -1)
          test -n "$dmg" || { echo "no .dmg found"; exit 1; }
          cp "$dmg" Reqnest-universal.dmg
          gh release upload "${{ github.ref_name }}" Reqnest-universal.dmg --clobber
