name: Cairn
description: Run a Cairn collection (assertions, scripts, OAuth, JUnit report)
inputs:
  path:
    description: Collection folder, sub-folder or a single .req.yaml file
    required: true
  env:
    description: Environment name
    required: false
  junit:
    description: Write a JUnit XML report to this file
    required: false
  args:
    description: Extra arguments for `cairn run` (e.g. "--bail --delay 200")
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Build the CLI
      shell: bash
      working-directory: ${{ github.action_path }}/cli
      run: npm ci && npm run build
    - name: Run the collection
      shell: bash
      run: |
        args=("${{ inputs.path }}")
        [ -n "${{ inputs.env }}" ] && args+=(--env "${{ inputs.env }}")
        [ -n "${{ inputs.junit }}" ] && args+=(--junit "${{ inputs.junit }}")
        node "${{ github.action_path }}/cli/dist/cairn.mjs" run "${args[@]}" ${{ inputs.args }}
