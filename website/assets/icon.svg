<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#4a2bd8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a0a66" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px squircle-ish tile centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#shine)"/>
  <g filter="url(#shadow)">
    <!-- outer diamond: the "nest" -->
    <path d="M512 232 L792 512 L512 792 L232 512 Z" fill="#ffffff"/>
  </g>
  <!-- inner diamond cut-out reveals the gradient, leaving a bright ring -->
  <path d="M512 330 L694 512 L512 694 L330 512 Z" fill="url(#bg)"/>
  <!-- the request: a small bright diamond travelling in -->
  <path d="M512 428 L596 512 L512 596 L428 512 Z" fill="#ffffff"/>
</svg>
