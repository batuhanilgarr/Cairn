[package]
name = "cairn"
version = "0.3.2"
description = "Cairn - local-first API client"
authors = ["Cairn"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "cookies", "stream"] }
tauri-plugin-dialog = "2.8.2"
futures-util = "0.3.34"
base64 = "0.23.1"
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.9"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tonic = { version = "0.14.6", features = ["tls-aws-lc", "tls-webpki-roots", "transport"] }
prost = "0.14.4"
prost-types = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
tokio-stream = "0.1.19"
tonic-reflection = "0.14.6"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http2", "aws-lc-rs"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio", "http2"] }
tower = { version = "0.5.3", features = ["util"] }
http = "1.5.0"
cookie_store = { version = "0.22.1", features = ["serde_json"] }
url = "2.5.8"
time = "0.3.55"
hyper = { version = "1.12.0", features = ["server", "http1"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
uuid = { version = "1.28.0", features = ["v4"] }


# The macOS Keychain, through the Security framework (the secret never goes through a command line).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

